name: Android Kernel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git \
            libssl-dev libncurses-dev wget cpio python3 zip

      # 3. Build
      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      # 4. Find ZIP file dynamically
      - name: Find ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"

      # 5. Upload ZIP
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ env.ZIP_FILE }}
